# File: .github/workflows/deploy.yml

name: Deploy Static Site to Pages

# Allow only one concurrent deployment, skipping runs queued between the runs of this workflow.
# If a UI-driven deployment is queued, it will be canceled and replaced by a new one.
concurrency:
  group: "pages"
  cancel-in-progress: true

on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build job
  build:
    # Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Node.js 24 (no npm project)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
          
      - name: Generate Files
        run: |
          node ./.github/workflows/random_file_gen.ts --out dist/public --depth 2
          node ./.github/workflows/random_file_gen.ts --out dist/private

      - name: Deploy to GitHub Pages
        id: deployment
        uses: Wu-Yijun/actions/.github/actions/react-apk@main
        with:
          SECRETS_ACCESS_PAT: ${{ secrets.SECRETS_ACCESS_PAT }}
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          app_name: My App
          app_package: com.exmaple.myapp
        # uses: Wu-Yijun/actions/.github/actions/deploy@main
        # with:
        #   token: ${{ github.token }}  # 密钥, 默认使用 actions 自带的权限
        #   path: "dist/"               # 静态页面路径, 默认使用 dist 文件夹
        #   expire: 0.5                 # 文件暴露时间, 默认 0.5 秒(越长越稳定, 越短越安全)
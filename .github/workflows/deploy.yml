# File: .github/workflows/deploy.yml

name: Deploy Static Site to Pages

# Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the runs of this workflow.
# If a UI-driven deployment is queued, it will be canceled and replaced by a new one.
concurrency:
  group: "pages"
  cancel-in-progress: true

on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build job
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Node.js 24 (no npm project)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
          
      - name: Generate Files
        run: |
          node ./.github/workflows/random_file_gen.ts --out dist/public --depth 2
          node ./.github/workflows/random_file_gen.ts --out dist/private
      - name: Deploy to GitHub Pages
        id: deployment
        uses: Wu-Yijun/actions/.github/actions/deploy/action@main